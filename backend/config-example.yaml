app:
  name: "food_link-backend-local"
  env: "development"
  host: "0.0.0.0"
  port: 3010

database:
  driver: "postgres"
  host: "127.0.0.1"
  port: 5432
  name: "food-link"
  user: "app_user"
  password: ""
  sslmode: "disable"
  schema: "public"

jwt:
  secret: "change-me"
  access_token_ttl_seconds: 3153600000
  refresh_token_ttl_seconds: 3153600000

otel:
  enabled: false
  traces_enabled: true
  metrics_enabled: true
  collector_endpoint: "localhost:4317"
  insecure: true
  metric_export_interval_seconds: 15

storage:
  cos_region: "ap-beijing"
  food_images_bucket: ""
  health_reports_bucket: ""
  user_avatars_bucket: ""
  icon_bucket: ""
  food_images_cdn_base_url: ""
  health_reports_cdn_base_url: ""
  user_avatars_cdn_base_url: ""
  icon_cdn_base_url: ""

external:
  llm_provider: ""
  tianditu_tk: ""
  ofoxai_api_key: ""
  ofoxai_base_url: "https://api.ofox.ai/v1"
  deepseek_api_key: ""
  doubao_api_key: ""
  doubao_base_url: "https://ark.cn-beijing.volces.com/api/v3"
  appid: ""
  secret: ""

worker:
  count: 1
  poll_interval_seconds: 2

task_queue:
  # memory is process-local and intended for local/dev server-embedded workers.
  # kafka uses brokers/topic/consumer_group and commits offsets only after task terminal state is persisted.
  driver: "memory"
  buffer_size: 1024
  topic: "food-link-analysis-tasks"
  brokers: []
  consumer_group: "food-link-workers"

wechat_pay:
  mchid: ""
  notify_url: ""
  serial_no: ""
  api_v3_key: ""
  private_key: ""
  public_key: ""
