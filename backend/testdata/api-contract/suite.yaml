name: food-link-api-contract
config_dir: "."

temp_db:
  enabled: true
  admin_database: "postgres"
  name_prefix: "food_link_e2e"
  keep: false

auth:
  users:
    user1:
      id: "00000000-0000-0000-0000-000000000001"
      openid: "e2e-openid-user1"
      unionid: "e2e-unionid-user1"
    user2:
      id: "00000000-0000-0000-0000-000000000002"
      openid: "e2e-openid-user2"
      unionid: "e2e-unionid-user2"
  test_backend_cookie: "api-contract-test"

default_vars:
  record.lunch.id: "00000000-0000-0000-0000-000000000011"
  expiry.milk.id: "00000000-0000-0000-0000-000000000021"
  recipe.basic.id: "00000000-0000-0000-0000-000000000031"

seed_sql:
  - "fixtures/base.sql"

route_smoke:
  enabled: true
  group: "route-smoke"
  auth: "none"
  path_params:
    user_id: "00000000-0000-0000-0000-000000000001"
    record_id: "00000000-0000-0000-0000-000000000011"
    item_id: "00000000-0000-0000-0000-000000000021"
    recipe_id: "00000000-0000-0000-0000-000000000031"
    log_id: "00000000-0000-0000-0000-000000000041"
    request_id: "00000000-0000-0000-0000-000000000051"
    prompt_id: "00000000-0000-0000-0000-000000000071"
    model_type: "food"
    batch_id: "00000000-0000-0000-0000-000000000081"
    dataset_id: "00000000-0000-0000-0000-000000000091"
    session_id: "00000000-0000-0000-0000-0000000000a1"
    comment_id: "00000000-0000-0000-0000-0000000000b1"
  query:
    date: "2026-05-14"
  body: {}
  expect_status: [200, 201, 202, 204, 302, 400, 401, 403, 404, 405]
  exclude:
    - "/api/login"
    - "/ws/stats/insight"
    - "/static/test_backend/*filepath"

cases:
  - name: system.health
    group: system
    method: GET
    path: /api/health
    expect:
      status: 200
      headers:
        X-Trace-Id: not_empty
      json:
        status: ok

  - name: system.root
    group: system
    method: GET
    path: /api
    expect:
      status: 200
      json:
        status: ok
        service: "food_link backend (go)"

  - name: user.profile.requires-auth
    group: auth
    method: GET
    path: /api/user/profile
    expect:
      status: 401
      json:
        detail: exists

  - name: user.profile.success
    group: user
    method: GET
    path: /api/user/profile
    auth: user1
    expect:
      status: 200
      headers:
        X-Trace-Id: not_empty
      json:
        code: 0
        data.id: "00000000-0000-0000-0000-000000000001"
        data.nickname: "E2E User"
        data.avatar: type:string

  - name: user.dashboard-targets.success
    group: user
    method: GET
    path: /api/user/dashboard-targets
    auth: user1
    expect:
      status: 200
      json:
        code: 0
        data.calorie_target: type:number
        data.protein_target: type:number

  - name: home.dashboard.success
    group: home
    method: GET
    path: /api/home/dashboard
    auth: user1
    query:
      date: "2026-05-14"
    expect:
      status: 200
      json:
        meals: type:array
        intakeData.current: type:number

  - name: food-record.detail.success
    group: food-record
    method: GET
    path: /api/food-record/00000000-0000-0000-0000-000000000011
    auth: user1
    expect:
      status: 200
      json:
        code: 0
        data.record.id: "00000000-0000-0000-0000-000000000011"
        data.record.meal_type: lunch

  - name: health.body-metrics.summary.success
    group: health
    method: GET
    path: /api/body-metrics/summary
    auth: user1
    query:
      date: "2026-05-14"
    expect:
      status: 200
      json:
        code: 0
        data.water_daily: type:array

  - name: health.water.create.success
    group: health
    method: POST
    path: /api/body-metrics/water
    auth: user1
    body:
      amount_ml: 120
      date: "2026-05-14"
      recorded_on: "2026-05-14"
    expect:
      status: 200
      json:
        code: 0
        data.item.date: "2026-05-14"
        data.item.amount_ml: 120

  - name: exercise.logs.list.success
    group: health
    method: GET
    path: /api/exercise-logs
    auth: user1
    query:
      date: "2026-05-14"
    expect:
      status: 200
      json:
        code: 0
        data.logs: type:array

  - name: membership.plans.public
    group: membership
    method: GET
    path: /api/membership/plans
    expect:
      status: 200
      json:
        code: 0
        data.list: type:array

  - name: membership.me.success
    group: membership
    method: GET
    path: /api/membership/me
    auth: user1
    query:
      date: "2026-05-14"
    expect:
      status: 200
      json:
        code: 0
        data.status: active

  - name: expiry.dashboard.success
    group: expiry
    method: GET
    path: /api/expiry/dashboard
    auth: user1
    expect:
      status: 200
      json:
        code: 0
        data.preview_items: type:array

  - name: recipes.list.success
    group: recipe
    method: GET
    path: /api/recipes
    auth: user1
    expect:
      status: 200
      json:
        code: 0
        data.recipes: type:array

  - name: manual-food.search.public
    group: utility
    method: GET
    path: /api/manual-food/search
    query:
      q: "米饭"
    expect:
      status: 200
      json:
        code: 0
        data.items: type:array
