# Copy this file to infisical-config.yaml for cloud-only configuration.
# This file is only bootstrap. Business runtime config must live in Infisical
# secrets. The active mode is selected in .env with CONFIG_SOURCE=infisical.

infisical:
  # Infisical server URL. Use the default SaaS URL unless you self-host Infisical.
  site_url: "https://app.infisical.com"

  # Infisical project identity. Prefer project_id; project_slug is an optional
  # human-readable alternative. Set only one unless you have a reason.
  project_id: ""
  project_slug: ""

  # Infisical environment slug/name, for example dev, staging, or prod.
  environment: "dev"

  # Secret folder path inside the selected project/environment.
  secret_path: "/"

  # Universal Auth machine identity credentials.
  client_id: ""
  client_secret: ""

  # Include secrets imported from other Infisical folders/projects.
  include_imports: true

  # Read nested folders below secret_path.
  recursive: false

  # Resolve Infisical secret references before returning values.
  expand_secret_references: true
