# Copy this file to app-config.yaml for local-only configuration.
# The active mode is selected in .env with CONFIG_SOURCE=local.

app:
  name: "food_link-backend-local"
  env: "development"
  host: "0.0.0.0"
  port: 3010
  # Admin 后台域名，用于飞书举报通知中的「去处理」链接
  admin_base_url: "https://admin.healthymax.cn"

database:
  driver: "postgres"
  host: "127.0.0.1"
  port: 5432
  name: "food-link"
  user: "app_user"
  password: ""
  sslmode: "disable"
  schema: "public"

jwt:
  secret: "change-me"
  access_token_ttl_seconds: 3153600000
  refresh_token_ttl_seconds: 3153600000

otel:
  enabled: false
  traces_enabled: true
  metrics_enabled: true
  collector_endpoint: "localhost:4317"
  insecure: true
  metric_export_interval_seconds: 15

storage:
  cos_region: "ap-beijing"
  food_images_bucket: ""
  health_reports_bucket: ""
  user_avatars_bucket: ""
  icon_bucket: ""
  food_images_cdn_base_url: ""
  health_reports_cdn_base_url: ""
  user_avatars_cdn_base_url: ""
  icon_cdn_base_url: ""

external:
  llm_provider: ""
  tianditu_tk: ""
  ofoxai_api_key: ""
  ofoxai_base_url: "https://api.ofox.ai/v1"
  gemini35_api_key: ""
  gemini35_base_url: ""
  gemini35_model: "gemini-3.5-flash"
  deepseek_api_key: ""
  # OpenAI-compatible endpoint prefix. This service appends /chat/completions.
  deepseek_base_url: "https://api.deepseek.com"
  # 像素分身图像编辑；密钥优先通过 PIXEL_AVATAR_API_KEY 环境变量注入。
  pixel_avatar_api_key: ""
  pixel_avatar_base_url: "https://maas-openapi.wanjiedata.com/api/v1"
  pixel_avatar_model: "gpt-image-2-pool"
  doubao_api_key: ""
  doubao_web_search_api_key: ""
  doubao_base_url: "https://ark.cn-beijing.volces.com/api/v3"
  # 营养库语义召回。密钥只放 Apollo / 环境变量，向量只用于候选召回，不能直接复用营养。
  nutrition_embedding_enabled: false
  nutrition_embedding_api_key: ""
  nutrition_embedding_base_url: "https://yunwu.ai/v1"
  nutrition_embedding_model: "text-embedding-3-large"
  nutrition_embedding_dimensions: 1024

wechat:
  mini_program:
    app_id: ""
    app_secret: ""

  # 小程序虚拟支付：仅在 Apollo / 部署环境中填写真实密钥，禁止提交真实值。
  xpay:
    offer_id: ""
    app_key: ""
    sandbox: true
    # 与公众平台“开发管理 → 消息推送”中配置的 Token 保持一致。
    message_token: ""
  mobile_app:
    app_id: ""
    app_secret: ""
    # development 下允许 Expo Go / 模拟器用固定 code mock 微信 App 登录，不触发微信开放平台请求。
    development_mock_code: "expo-go-dev-wechat-code"
  pay:
    mchid: ""
    notify_url: ""
    serial_no: ""
    api_v3_key: ""
    # 委托代扣 V2 API 密钥。不要使用 API v3 密钥替代。
    api_v2_key: ""
    private_key: ""
    public_key: ""
    # 供微信委托代扣纯签约、扣款结果通知使用，必须是公网 HTTPS URL，且不能带 query 参数。
    papay_sign_notify_url: "https://api.healthymax.cn/api/payment/wechat/papay/contract/notify"
    papay_pay_notify_url: "https://api.healthymax.cn/api/payment/wechat/papay/pay/notify"
    expiry_subscribe_template_id: ""
    analysis_subscribe_template_id: ""

redis:
  # 短信验证码存储与节流。
  # mode: auto 有 url 时使用 Redis；development 无 url 时使用本地内存；production 建议显式用 redis。
  # mode: redis 强制使用 Redis；mode: memory 仅用于本地开发。
  mode: "auto"
  url: ""
  password: ""
  db: 0
  key_prefix: "food_link"

sms:
  # 腾讯云短信；模板参数顺序为 [验证码, 有效分钟数]。
  # Apollo 的 app-config.yaml namespace 中按本段 yaml 结构配置，不走环境变量。
  tencentcloud_secret_id: ""
  tencentcloud_secret_key: ""
  tencentcloud_region: "ap-guangzhou"
  tencentcloud_sms_sdk_app_id: ""
  tencentcloud_sms_sign_name: ""
  tencentcloud_sms_verification_template_id: ""
  # 验证码有效期，单位分钟；会作为短信模板第 2 个变量发送。
  code_ttl_minutes: 15
  # 同一手机号发送验证码的最小间隔，单位秒；用于防止用户连续点击发送。
  throttle_seconds: 30
  # 同一客户端 IP 发送验证码的最小间隔，单位秒；用于防止单 IP 批量刷短信。
  ip_throttle_seconds: 30

worker:
  count: 1
  poll_interval_seconds: 2

task_queue:
  # memory is process-local and intended for local/dev server-embedded workers.
  # kafka uses brokers/topic/consumer_group and commits offsets only after task terminal state is persisted.
  driver: "memory"
  buffer_size: 1024
  topic: "food-link-analysis-tasks"
  brokers: []
  consumer_group: "food-link-workers"

feishu:
  # 意见反馈飞书机器人 Webhook（留空则关闭通知）
  feedback_webhook_url: ""
  feedback_webhook_secret: ""
  # 圈子动态举报飞书机器人 Webhook（留空则关闭通知）
  report_webhook_url: ""
  report_webhook_secret: ""
  # 飞书自建应用凭证，用于上传图片到飞书获取 image_key（首图预览需要）
  # 留空则首图会降级为可点击链接
  app_id: ""
  app_secret: ""

feedback_bot:
  # 开启后，用户在系统内提交意见反馈时，后端会异步推送到 feedback-bot，
  # 由 feedback-bot 统一写入用户反馈专用飞书多维表格。
  enabled: false
  base_url: "https://your-feedback-bot-domain"
  auth_token: ""
  project_key: "foodlink"
  timeout_seconds: 5
