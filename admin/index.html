<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>食探 Admin</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: #eef2f5; }
      .admin-bootstrap {
        position: fixed;
        inset: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #667085;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .admin-bootstrap__spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(8, 127, 109, 0.18);
        border-top-color: #087f6d;
        border-radius: 999px;
        animation: admin-bootstrap-spin 0.8s linear infinite;
      }
      .admin-bootstrap__error { max-width: 420px; padding: 24px; text-align: center; }
      .admin-bootstrap__error strong { display: block; margin-bottom: 8px; color: #172033; }
      @keyframes admin-bootstrap-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1120; }
        .admin-bootstrap { color: #94a3b8; }
        .admin-bootstrap__spinner { border-color: rgba(16, 185, 129, 0.2); border-top-color: #10b981; }
        .admin-bootstrap__error strong { color: #e2e8f0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .admin-bootstrap__spinner { animation-duration: 1.6s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="admin-bootstrap" data-admin-bootstrap role="status" aria-label="页面载入中">
        <span class="admin-bootstrap__spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script>
      (() => {
        const showLoadError = () => {
          const boot = document.querySelector('[data-admin-bootstrap]')
          if (!boot) return
          boot.innerHTML = '<div class="admin-bootstrap__error"><strong>页面暂时没有加载完成</strong><span>请刷新页面；如果仍然失败，请检查网络后重试。</span></div>'
        }
        window.addEventListener('error', showLoadError)
        window.addEventListener('unhandledrejection', showLoadError)
        window.setTimeout(showLoadError, 15000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
