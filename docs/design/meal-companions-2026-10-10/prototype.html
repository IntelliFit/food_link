function options(values,selected){return values.map(v=>`<option value="${esc(v)}" ${String(selected)===String(v)?'selected':''}>${esc(v)}</option>`).join('')}
function card(x){let badge=x.status==='cancelled'?'已取消':x.application==='pending'?'待确认':x.application==='accepted'?'已加入':x.application==='owner'?'我发起的':x.capacity>x.count?`还差 ${x.capacity-x.count} 人`:'已满';return`<article class="card"><div class="author">${avatar(x.id%2?'':'tan')}<div><div class="author-name">${esc(x.host)}</div><small>${esc(x.area)} · 自填</small></div><button class="icon-button" data-action="more" data-id="${x.id}" aria-label="约饭更多操作">${icon('ic_detail')}</button></div><h3>${esc(x.title)}</h3><div class="meta time">${icon('shizhong')} ${x.day} ${esc(x.time)} <span class="badge ${x.application!=='none'?'green':''}">${badge}</span></div><div class="meta">${icon('dizhi')} ${esc(x.place)}</div><div class="meta">${icon('tianpingzuo')} ¥${esc(x.price)} / 人 · ${esc(x.payment)}</div><div class="tags">${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span class="tag">直线约 ${x.distance} km</span></div><div class="card-footer"><span class="member-count">${icon('duoren')} ${x.count}/${x.capacity} 人已确认</span><button class="btn small-btn" data-action="detail" data-id="${x.id}">查看约饭 ${icon('right')}</button></div></article>`}
function community(){let list=state.items.filter(x=>x.status==='open'&&x.scope!=='仅邀请链接'&&!state.hidden.includes(x.id)&&x.count<x.capacity&&x.area===state.area&&(state.day==='不限日期'||x.day===state.day)&&(state.meal==='不限餐次'||x.meal===state.meal)&&x.distance<=state.distance&&x.budget<=state.budget);let pending=state.items.reduce((n,x)=>n+(x.requests||[]).filter(r=>r.state==='pending').length,0);return`<div class="screen padded">${communityHeader()}${state.tab==='feed'?feed():`<div class="filter-panel"><button class="location" data-action="location">${icon('dizhi')} ${esc(state.area)} ${icon('right')}<small class="muted">演示地点</small></button><div class="select-row"><select aria-label="日期筛选" data-filter="day">${options(['今天','明天','不限日期'],state.day)}</select><select aria-label="餐次筛选" data-filter="meal">${options(['午餐','晚餐','不限餐次'],state.meal)}</select><select aria-label="距离筛选" data-filter="distance"><option value="1" ${state.distance===1?'selected':''}>附近 1 km</option><option value="3" ${state.distance===3?'selected':''}>附近 3 km</option></select><button class="icon-button" data-action="filters" aria-label="更多筛选">${icon('filter-filling')}</button></div></div><button class="my-strip" data-action="go" data-page="mine">${icon('jishiben')} 我的约饭 <small class="muted">· ${pending?'有 '+pending+' 个待处理申请':'查看我的安排'}</small><span class="right">${icon('right')}</span></button>${list.length?list.map(card).join(''):`<div class="empty">${icon('duoren')}<h3>这会儿，还没有合适的约饭</h3><p class="small">换个时间看看，或自己发起一顿。</p><button class="btn secondary" data-action="clear-filters">放宽时间和预算</button></div>`}`}</div>${state.tab==='find'?`<button class="btn fab" data-action="go" data-page="create">${icon('edit')} 发起约饭</button>`:''}${nav()}`}
function feed(){return`<div class="rank-preview"><div class="rank-heading"><strong>${icon('shangzhang')} 本周榜单</strong><span>10.05–10.11 · 示例</span></div><div class="rank-entries"><button data-action="rank" data-type="user"><b>用户榜 ${icon('right')}</b><small>全体记录 · 好友健康</small></button><button data-action="rank" data-type="food"><b>食物榜 ${icon('right')}</b><small>蛋白质 · 纤维 · 钙</small></button></div></div><p class="small muted" style="margin-bottom:14px">大家今天吃了什么</p>${[{id:1,name:'阿禾',text:'午饭吃舒服了，下午才有精神。',food:'鸡腿饭 + 时蔬',cal:'约 580 kcal',tag:'今天 · 午餐',comment:'小夏：这个搭配看着不错！'},{id:2,name:'小林',text:'周末也认真吃早餐。',food:'鸡蛋 · 牛奶 · 全麦面包',cal:'约 420 kcal',tag:'今天 · 早餐',comment:'七七：我也喜欢这个组合。'}].map(f=>`<article class="card"><div class="author">${avatar(f.id===1?'':'tan')}<div><div class="author-name">${f.name}</div><small>${f.tag}</small></div></div><p style="font-size:14px">${f.text}</p><div class="feed-plate">${icon('shiwu')}<div><strong>${f.food}</strong><span>${f.cal} · 作者选择公开</span></div></div><div class="feed-actions"><button data-action="like" data-id="${f.id}" class="${state.likes[f.id]?'liked':''}" aria-pressed="${!!state.likes[f.id]}">${icon(state.likes[f.id]?'like_fill':'like')} ${8+Number(!!state.likes[f.id])}</button><button data-action="comment" data-id="${f.id}">${icon('comment')} 评论 ${1+(state.comments[f.id]||[]).length}</button><button data-action="invite-from-feed">${icon('duoren')} 约下一顿</button></div><div class="comment-preview">${f.comment}${(state.comments[f.id]||[]).map(c=>`<div>我：${esc(c)}</div>`).join('')}</div></article>`).join('')}`}
function detail(){const x=current();let action=x.status==='cancelled'?'<button class="btn secondary" disabled>这顿约饭已取消</button>':x.application==='owner'?'<button class="btn" data-action="go" data-page="manage">管理约饭</button><button class="btn secondary" data-action="go" data-page="room">进入房间</button>':x.application==='pending'?'<button class="btn secondary" data-action="withdraw">撤回申请</button><button class="btn" disabled>等待发起人确认</button>':x.application==='accepted'?'<button class="btn" data-action="go" data-page="room">进入约饭房间</button>':x.count>=x.capacity?'<button class="btn secondary" disabled>人数已满</button>':'<button class="btn" data-action="apply">申请加入这顿饭</button>';return`${titleBar('约饭详情')}<div class="screen page-content">${x.application==='pending'?'<div class="banner">申请已送达，等发起人确认后才能加入。<br><small>可用原型控制区「模拟同意」继续体验。</small></div>':''}${x.application==='accepted'?'<div class="banner">发起人已同意你的申请，一起吃顿好饭。</div>':''}<div class="author">${avatar()}<div><div class="author-name">${esc(x.host)}</div><small>${esc(x.area)} · 自填</small></div></div><h2 class="detail-title">${esc(x.title)}</h2><div class="hero-meta"><div class="meta time">${icon('shizhong')} ${x.day} ${esc(x.time)} · ${x.meal}</div><div class="meta">${icon('dizhi')} ${esc(x.place)}</div><div class="meta">${icon('tianpingzuo')} ¥${esc(x.price)} / 人 · ${esc(x.payment)}</div><div class="meta">${icon('duoren')} ${x.count}/${x.capacity} 人已确认（含发起人）</div></div><h3 class="section-label">这顿饭怎么吃</h3><p style="font-size:14px">${esc(x.note)}</p><div class="tags">${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><h3 class="section-label">加入后</h3><p class="info-line">发起人确认后，进入这顿饭的专属房间。桌号、集合说明和成员讨论只对已确认成员开放。临时有事可以退出，并通知其他成员。</p><p class="info-line">${x.area==='示例大学'?'该食堂仅校内成员可进入。':'请在公共餐厅见面，餐费按约定到店支付。'}</p><div class="divider"></div><button class="quicklink" data-action="more" data-id="${x.id}">举报或屏蔽这条约饭 ${icon('right')}</button></div><div class="action-bar">${action}</div>`}
function ranks(){const user=state.rankType==='user';let filters=user?[['records','全体记录'],['health','好友健康']]:[['protein','蛋白质'],['fiber','纤维'],['calcium','钙']];let rows=user?(state.rankFilter==='health'?[['小夏','86','健康分'],['阿禾','82','健康分'],['我','79','健康分']]:[['阿禾','18','条记录'],['小林','16','条记录'],['七七','14','条记录'],['我','11','条记录']]):state.rankFilter==='fiber'?[['鹰嘴豆','7.6','g / 100 g'],['燕麦','6.0','g / 100 g'],['西兰花','2.6','g / 100 g']]:state.rankFilter==='calcium'?[['豆腐','164','mg / 100 g'],['原味酸奶','118','mg / 100 g'],['纯牛奶','104','mg / 100 g']]:[['鸡胸肉','24.6','g / 100 g'],['鸡蛋','13.1','g / 100 g'],['豆腐','8.1','g / 100 g']];return`${titleBar('本周排行榜')}<div class="screen page-content"><p class="small muted" style="margin-bottom:14px">10 月 5 日 — 10 月 11 日</p><div class="segment"><button class="${user?'active':''}" data-action="rank-type" data-type="user">用户榜</button><button class="${!user?'active':''}" data-action="rank-type" data-type="food">食物榜</button></div><div class="rank-tabs">${filters.map(([id,label])=>`<button data-action="rank-filter" data-value="${id}" class="${state.rankFilter===id?'active':''}">${label}</button>`).join('')}</div><div class="banner">${user?'把每一餐认真记下来。':'从大家的餐盘里，发现营养好食物。'}</div>${rows.map((r,i)=>`<div class="ranking-row"><span class="rank-num">${i+1}</span>${avatar(i%2?'tan':'')}<strong style="font-size:14px">${r[0]}</strong><div class="rank-value">${r[1]}<small>${r[2]}</small></div>`).join('')}<div class="demo-warning">这里的名次、数值与计量口径只用于布局演示。正式版本沿用现有排行榜接口与规则，约饭不改变原有统计。</div></div>`}
function create(){let d=state.draft;return`${titleBar('发起约饭')}<div class="screen page-content"><div class="banner">把时间、地点说清楚，就可以邀请人一起吃。</div><form id="create-form"><label class="field"><span>一句话邀约</span><input name="title" maxlength="35" value="${esc(d.title)}" placeholder="比如：午休一起吃碗热乎的" required></label><div class="form-grid"><label class="field"><span>哪一天</span><select name="day">${options(['今天','明天'],d.day)}</select></label><label class="field"><span>几点见</span><input name="time" type="time" value="${esc(d.time)}" required></label></div><label class="field"><span>在哪里吃</span><select name="place">${options(['园区食堂一层','园区东门·轻食小馆','东门商业街·和风食堂'],d.place)}</select><small>当前演示片区：科技园，均为虚构地点。</small></label><div class="form-grid"><label class="field"><span>人均预算上限 · 元</span><input name="budget" type="number" min="1" max="500" value="${d.budget}" required></label><label class="field"><span>总人数 · 含自己</span><select name="capacity">${options([2,3,4],d.capacity)}</select></label></div><div class="form-grid"><label class="field"><span>付款方式</span><select name="payment">${options(['各自付款','AA'],d.payment)}</select></label><label class="field"><span>谁可以看到</span><select name="scope">${options(['片区公开','仅邀请链接'],d.scope)}</select></label></div><label class="field"><span>补充说明 · 选填</span><textarea name="note" maxlength="200" placeholder="口味、聊天偏好，或碰面的安排…">${esc(d.note)}</textarea></label><p class="info-line" style="margin-bottom:18px">默认由你确认加入申请。发布后可以查看申请、与成员沟通或取消约饭。</p>${state.formError?`<p class="error" role="alert">${esc(state.formError)}</p>`:''}<button class="btn wide" type="submit">发布约饭</button></form></div>`}
function mine(){let list=state.items.filter(x=>x.application!=='none');if(state.myTab==='owner')list=list.filter(x=>x.application==='owner');if(state.myTab==='joined')list=list.filter(x=>x.application!=='owner');return`${titleBar('我的约饭')}<div class="screen page-content"><div class="segment"><button class="${state.myTab==='all'?'active':''}" data-action="my-tab" data-value="all">全部</button><button class="${state.myTab==='owner'?'active':''}" data-action="my-tab" data-value="owner">我发起的</button><button class="${state.myTab==='joined'?'active':''}" data-action="my-tab" data-value="joined">我申请的</button></div>${list.length?list.map(card).join(''):'<div class="empty"><h3>还没有申请过约饭</h3><p>去找一顿你想参加的饭吧。</p><button class="btn" data-action="community">去找搭子</button></div>'}</div>`}
function manage(){let x=current();return`${titleBar('管理约饭')}<div class="screen page-content"><div class="room-heading"><h3>${esc(x.title)}</h3><p>${x.day} ${esc(x.time)} · ${x.count}/${x.capacity} 人已确认</p></div><h3 class="section-label">加入申请</h3>${(x.requests||[]).length?(x.requests||[]).map((r,i)=>`<div class="attendance"><div><b>${esc(r.name)}</b><p class="small muted">${esc(r.note)}</p></div>${r.state==='pending'?`<div class="form-actions"><button class="btn secondary" data-action="request-reject" data-index="${i}">婉拒</button><button class="btn" data-action="request-accept" data-index="${i}" ${x.count>=x.capacity||x.status==='cancelled'?'disabled':''}>同意</button></div>`:`<span class="status-pill">${r.state==='accepted'?'已同意':'已婉拒'}</span>`}</div>`).join(''):'<p class="info-line">还没有申请，可以邀请朋友来参加。</p>'}<div class="divider"></div><button class="quicklink" data-action="go" data-page="room">进入约饭房间 ${icon('right')}</button><button class="quicklink" data-action="invite">邀请朋友 ${icon('share')}</button><button class="quicklink" data-action="cancel-meal" ${x.status==='cancelled'?'disabled':''}>${x.status==='cancelled'?'约饭已取消':'取消这顿约饭'} ${icon('right')}</button></div>`}
function room(){let x=current();if(!['owner','accepted'].includes(x.application))return`${titleBar('约饭房间')}<div class="empty"><h3>获确认后即可进入</h3><button class="btn" data-action="detail" data-id="${x.id}">查看申请状态</button></div>`;return`${titleBar('这顿饭的房间')}<div class="screen page-content" id="room-scroll"><div class="room-heading"><h3>${esc(x.title)}</h3><p>${x.day} ${esc(x.time)} · ${esc(x.place)}</p><p>集合说明：餐厅入口右侧等，到了在这里说一声。</p></div>${x.status==='cancelled'?'<div class="banner" style="margin-top:12px">约饭已取消，讨论已关闭。</div>':''}<div class="system-line">仅已确认成员可见 · ${x.count} 人</div><div class="bubble-row">${avatar()}<div><div class="bubble-name">${esc(x.host==='我'?'小夏':x.host)}</div><div class="bubble">到时候见！我会提前几分钟到门口。</div></div></div>${(state.messages[x.id]||[]).map(t=>`<div class="bubble-row self">${avatar('tan')}<div><div class="bubble-name">我</div><div class="bubble">${esc(t)}</div></div></div>`).join('')}<div class="divider"></div><button class="quicklink" data-action="go" data-page="record">饭后记下这顿 ${icon('right')}</button><button class="quicklink" data-action="again">再约一次 ${icon('right')}</button>${x.application==='owner'?'<button class="quicklink" data-action="go" data-page="manage">管理这顿约饭 '+icon('right')+'</button>':'<button class="quicklink" data-action="leave">退出这顿约饭 '+icon('right')+'</button>'}</div><form class="message-form" id="message-form"><input name="message" aria-label="房间消息" placeholder="说一句，待会儿见…" maxlength="300" required ${x.status==='cancelled'?'disabled':''}><button class="btn" type="submit" ${x.status==='cancelled'?'disabled':''}>发送</button></form>`}
function inbox(){return`${titleBar('消息')}<div class="screen page-content"><p class="small muted">约饭通知</p>${state.notices.map(n=>`<button class="notice" data-action="detail" data-id="${n.id}"><strong>${esc(n.title)}</strong><p>${esc(n.text)}</p><small>刚刚 · 查看约饭</small></button>`).join('')}<button class="notice" data-action="detail" data-id="4"><strong>小夏申请加入你的约饭</strong><p>明天午餐，来两个新朋友</p><small>查看并处理</small></button><div class="divider"></div><button class="quicklink" data-action="info" data-title="互动消息" data-text="这里承接现有圈子的点赞、评论与回复。原型中可以在晒餐页点赞和评论。">互动消息 ${icon('right')}</button><button class="quicklink" data-action="info" data-title="私信与好友" data-text="保留现有私信、好友管理和添加好友功能。约饭房间不要求先互加好友。">私信与好友 ${icon('right')}</button></div>`}
function record(){return`${titleBar('记下这顿饭')}<div class="screen page-content"><div class="banner">吃完之后，把自己的那一份记下来。</div><div class="feed-plate">${icon('paizhao-xianxing')}<div><strong>拍照记餐</strong><span>原型演示，不打开相机</span></div></div><p class="info-line">正式版本接回现有识别与记餐流程。下面用一份示例记录体验分享设置。</p><div class="divider"></div><h3>鸡腿饭 + 时蔬</h3><p class="muted small">我的份量 · 约 580 kcal</p><form id="record-form" style="margin-top:22px"><label class="field"><span>这条记录的分享方式</span><select name="visibility"><option>仅自己可见</option><option>分享到晒餐</option></select></label><label class="field"><span><input type="checkbox" name="nutrition"> 分享时展示营养数据</span></label><button class="btn wide" type="submit">保存示例记录</button></form><p class="info-line">不会替同桌的人记账，也不会自动公开健康档案。</p></div>`}
function other(){let p=state.page;return`${titleBar(p==='home'?'首页':p==='analysis'?'饮食分析':'我的')}<div class="screen page-content">${p==='home'?`<h2>下一餐，和谁一起吃？</h2><p class="info-line">这是首页与约饭的衔接示意。</p><div class="card" style="margin-top:20px"><h3>园区食堂 · 午餐建议</h3><p class="muted small">鸡腿饭 + 时蔬</p><button class="btn wide" style="margin-top:18px" data-action="invite-from-feed">找人一起吃</button></div>`:p==='analysis'?'<div class="empty">'+icon('tubiao-zhuzhuangtu')+'<h3>饮食分析沿用现有功能</h3><p class="small">本次原型聚焦圈子与约饭流程。</p><button class="btn" data-action="community">回到圈子</button></div>':`<div class="author">${avatar()}<div><h3>演示用户</h3><small>所有修改只在当前页面有效</small></div></div><button class="quicklink" data-action="go" data-page="mine">我的约饭 ${icon('right')}</button><button class="quicklink" data-action="rank" data-type="user">查看排行榜 ${icon('right')}</button><button class="quicklink" data-action="go" data-page="inbox">消息与好友 ${icon('right')}</button>`}</div>`}
function modalView(){let m=state.modal;if(!m)return'';let content='';if(m.type==='location')content=`<p class="info-line" style="margin-bottom:15px">手动选择片区，不需要提供定位。</p><div class="chips">${['科技园','示例大学'].map(a=>`<button class="${state.area===a?'active':''}" data-action="choose-location" data-value="${a}">${a}</button>`).join('')}</div>`;if(m.type==='filters')content=`<form id="filter-form"><label class="field"><span>人均预算上限</span><select name="budget"><option value="100" ${state.budget===100?'selected':''}>不限（演示上限 100 元）</option><option value="30" ${state.budget===30?'selected':''}>30 元以内</option><option value="50" ${state.budget===50?'selected':''}>50 元以内</option></select></label><p class="info-line" style="margin-bottom:18px">已选择：${state.area} · ${state.day} · ${state.meal}</p><button class="btn wide" type="submit">应用筛选</button></form>`;if(m.type==='apply')content=`<p class="info-line" style="margin-bottom:15px">你将申请加入「${esc(current().title)}」。对方确认后才能进入房间。</p><form id="apply-form"><label class="field"><span>和发起人打个招呼 · 选填</span><textarea name="note" maxlength="100" placeholder="我也在附近，中午一起吃！"></textarea></label><button class="btn wide" type="submit">发送加入申请</button></form>`;if(m.type==='comment')content=`<form id="comment-form"><label class="field"><span>写下你的评论</span><textarea name="comment" maxlength="200" required placeholder="聊聊这顿饭…"></textarea></label><button class="btn wide" type="submit">发布评论</button></form>`;if(m.type==='info')content=`<p style="font-size:14px;margin-bottom:20px">${esc(m.text)}</p><button class="btn wide" data-action="close">知道了</button>`;if(m.type==='confirm')content=`<p style="font-size:14px;margin-bottom:20px">${esc(m.text)}</p><button class="btn wide danger" data-action="${m.confirm}">${esc(m.label)}</button><button class="btn wide secondary" data-action="close">先保留</button>`;if(m.type==='more')content=`<button class="quicklink" data-action="report">举报这条约饭 ${icon('right')}</button><button class="quicklink" data-action="hide-meal">不看这条约饭 ${icon('right')}</button><p class="info-line">原型只演示操作反馈，不发送真实举报。</p>`;return`<div class="overlay" data-action="overlay-close"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(m.title)}"><div class="sheet-head"><h2>${esc(m.title)}</h2><button class="icon-button" data-action="close" aria-label="关闭">${icon('close')}</button></div>${content}</section></div>`}
function render(){const views={community,detail,ranks,create,mine,manage,room,inbox,record};$('#app').innerHTML=(views[state.page]||other)()+modalView();$('#tour').innerHTML=[['community','找搭子','find'],['community','晒餐与排行榜','feed'],['create','发起约饭'],['mine','我的约饭'],['inbox','消息通知']].map(([p,t,tab],i)=>`<button class="step ${state.page===p&&(!tab||state.tab===tab)?'active':''}" data-action="tour" data-page="${p}" ${tab?`data-tab="${tab}"`:''}><span>0${i+1}</span><span>${t}</span></button>`).join('');if(state.modal){requestAnimationFrame(()=>$('.sheet textarea,.sheet select,.sheet button')?.focus())}}
function openModal(m){state.modal=m;render()}
function notify(title,text,id){state.notices.unshift({title,text,id})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;let a=b.dataset.action,x=current();if(a==='overlay-close'){if(e.target===b){state.modal=null;render()}return}if(a==='go')return go(b.dataset.page);if(a==='tour')return go(b.dataset.page,b.dataset.tab?{tab:b.dataset.tab}:{});if(a==='back')return back();if(a==='community')return go('community',{tab:'find'});if(a==='tab'){state.tab=b.dataset.tab;render();return}if(a==='detail')return go('detail',{selected:Number(b.dataset.id)});if(a==='close'){state.modal=null;render();return}if(a==='location')return openModal({type:'location',title:'选择你想约饭的片区'});if(a==='choose-location'){state.area=b.dataset.value;state.modal=null;render();return}if(a==='filters')return openModal({type:'filters',title:'更多筛选'});if(a==='clear-filters'){state.day='不限日期';state.meal='不限餐次';state.budget=100;render();return}if(a==='apply')return openModal({type:'apply',title:'一起吃顿饭'});if(a==='simulate'){let pending=state.items.find(y=>y.id===state.selected&&y.application==='pending')||state.items.find(y=>y.application==='pending');if(!pending)return toast('先选一顿饭，发送加入申请。');if(pending.status!=='open'||pending.count>=pending.capacity)return toast('这顿饭已不可加入。');pending.application='accepted';pending.count++;notify('加入申请已通过',pending.title,pending.id);go('detail',{selected:pending.id});toast('已模拟发起人同意，可进入约饭房间');return}if(a==='withdraw'){x.application='none';render();toast('申请已撤回');return}if(a==='rank')return go('ranks',{rankType:b.dataset.type,rankFilter:b.dataset.type==='user'?'records':'protein'});if(a==='rank-type'){state.rankType=b.dataset.type;state.rankFilter=state.rankType==='user'?'records':'protein';render();return}if(a==='rank-filter'){state.rankFilter=b.dataset.value;render();return}if(a==='like'){let id=b.dataset.id;state.likes[id]=!state.likes[id];const s=$('.screen').scrollTop;render();$('.screen').scrollTop=s;return}if(a==='comment')return openModal({type:'comment',title:'评论这顿饭',id:Number(b.dataset.id)});if(a==='my-tab'){state.myTab=b.dataset.value;render();return}if(a==='request-accept'||a==='request-reject'){let r=x.requests[Number(b.dataset.index)];if(r.state!=='pending')return;if(a==='request-accept'){if(x.count>=x.capacity)return toast('人数已满');r.state='accepted';x.count++}else r.state='rejected';render();toast(a==='request-accept'?'已同意，小夏加入了约饭':'已婉拒申请');return}if(a==='invite-from-feed'){state.draft.title='下一顿，找个人一起吃';return go('create')}if(a==='again'){state.draft={title:x.title,day:'明天',time:x.time,place:x.place,budget:x.budget,capacity:x.capacity,payment:x.payment,scope:'片区公开',note:x.note};return go('create')}if(a==='invite')return openModal({type:'info',title:'邀请朋友',text:`邀请卡片会包含「${x.title}」、${x.day} ${x.time}、${x.place} 和剩余名额。此处只预览说明，不生成公开链接或发送消息。`});if(a==='leave')return openModal({type:'confirm',title:'退出这顿约饭？',text:'你的名额会释放，其他成员将收到退出通知。',confirm:'leave-confirm',label:'确认退出'});if(a==='leave-confirm'){x.application='none';x.count=Math.max(1,x.count-1);state.modal=null;go('detail');toast('已退出约饭，名额已释放');return}if(a==='cancel-meal')return openModal({type:'confirm',title:'取消这顿约饭？',text:'活动将停止接受申请，已加入成员会收到取消通知。',confirm:'cancel-confirm',label:'确认取消约饭'});if(a==='cancel-confirm'){x.status='cancelled';notify('约饭已取消',x.title,x.id);state.modal=null;render();toast('约饭已取消');return}if(a==='more'){state.selected=Number(b.dataset.id);return openModal({type:'more',title:'约饭操作'})}if(a==='report'){state.modal=null;render();toast('已演示举报提交，未发送真实举报');return}if(a==='hide-meal'){state.hidden.push(state.selected);state.modal=null;go('community');toast('本次演示中已隐藏');return}if(a==='info')return openModal({type:'info',title:b.dataset.title,text:b.dataset.text});if(a==='reset'){state=fresh();render();toast('已恢复初始演示数据');return}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter){state[el.dataset.filter]=el.dataset.filter==='distance'?Number(el.value):el.value;render()}});
document.addEventListener('input',e=>{if(e.target.form?.id==='create-form'){state.draft[e.target.name]=e.target.value}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f),x=current();if(f.id==='apply-form'){if(x.status!=='open'||x.count>=x.capacity){state.modal=null;render();toast('这顿饭已不可加入');return}x.application='pending';x.applicationNote=String(d.get('note'));state.modal=null;render();toast('加入申请已送达');return}if(f.id==='filter-form'){state.budget=Number(d.get('budget'));state.modal=null;render();return}if(f.id==='comment-form'){let id=state.modal.id,t=String(d.get('comment')).trim();if(!t)return;state.comments[id]??=[];state.comments[id].push(t);state.modal=null;render();toast('评论已发布');return}if(f.id==='create-form'){let obj=Object.fromEntries(d),budget=Number(obj.budget),capacity=Number(obj.capacity),title=String(obj.title).trim();state.draft={...obj};if(!title||budget<1||budget>500||![2,3,4].includes(capacity)){state.formError='请检查标题、预算与人数。';render();return}let id=Math.max(...state.items.map(y=>y.id),5)+1;state.items.unshift({id,host:'我',title,area:'科技园',day:obj.day,meal:parseInt(obj.time)<16?'午餐':'晚餐',time:obj.time,place:obj.place,distance:0.4,budget,price:`≤${budget}`,payment:obj.payment,count:1,capacity,tags:[obj.scope],scope:obj.scope,note:obj.note||'一起轻松吃顿饭，欢迎加入。',status:'open',application:'owner',requests:[]});state.formError='';notify('约饭发布成功',title,id);go('detail',{selected:id});toast('演示约饭已发布');return}if(f.id==='message-form'){let t=String(d.get('message')).trim();if(!t||x.status==='cancelled'||!['owner','accepted'].includes(x.application))return;state.messages[x.id]??=[];state.messages[x.id].push(t);render();$('#room-scroll').scrollTop=$('#room-scroll').scrollHeight;return}if(f.id==='record-form'){go('community',{tab:'feed'});toast(d.get('visibility')==='分享到晒餐'?'已演示保存并分享；不会写入真实记录':'已演示保存为仅自己可见');return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
render();
</script>
</body>
</html>
