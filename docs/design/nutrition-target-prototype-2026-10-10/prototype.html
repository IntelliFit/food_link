    #foodlink-target-ui .fl-choice-macros { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:10px; font-size:12px; color:var(--fl-sub); }
    #foodlink-target-ui .fl-choice-macros b { color:var(--fl-text); font-weight:500; margin-left:3px; }
    #foodlink-target-ui .fl-template-name { font-size:16px; overflow-wrap:anywhere; }
    #foodlink-target-ui .fl-sheet-footer { margin-top:16px; padding-top:10px; }
    #foodlink-target-ui .fl-note { padding:12px 14px; font-size:12px; border-radius:10px; margin:0 0 19px; }
    #foodlink-target-ui .fl-library-row { background:var(--fl-surface); border:1px solid var(--fl-line); border-radius:14px; padding:18px 17px 4px; margin:12px 0; }
    #foodlink-target-ui .fl-library-actions { border-top:1px solid var(--fl-line); margin-top:13px; padding:3px 0; gap:14px; }
    #foodlink-target-ui .fl-library-actions button { font-size:12px; }
    #foodlink-target-ui .fl-apply-small { background:transparent; border:0; color:var(--fl-green); padding:9px 0; min-height:44px; font-size:12px; font-weight:500; }
    #foodlink-target-ui .fl-field { margin:19px 0; }
    #foodlink-target-ui .fl-label { font-size:13px; color:var(--fl-sub); margin-bottom:8px; }
    #foodlink-target-ui .fl-input { background:var(--fl-surface); border-color:#e1e9e3; padding:12px 13px; border-radius:9px; }
    #foodlink-target-ui .fl-input[readonly] { background:#f2f7f3; }
    #foodlink-target-ui .fl-input-row { gap:8px; }
    #foodlink-target-ui .fl-unit { min-width:24px; font-size:12px; }
    #foodlink-target-ui .fl-check { border:1px solid var(--fl-line); border-radius:11px; padding:13px; margin:0 0 8px; background:var(--fl-surface); }
    #foodlink-target-ui .fl-check span { font-size:13px; }
    #foodlink-target-ui .fl-check .fl-sub { font-size:11px; margin-top:2px; }
    #foodlink-target-ui .fl-grid { gap:0 12px; }
    #foodlink-target-ui .fl-primary { background:#246e4d; border-radius:10px; font-size:14px; min-height:48px; }
    #foodlink-target-ui .fl-profile-intro { padding:10px 3px 24px; }
    #foodlink-target-ui .fl-profile-intro h3 { font-size:25px; font-weight:600; margin:0 0 7px; }
    #foodlink-target-ui .fl-entry { display:block; width:100%; background:var(--fl-surface); color:var(--fl-text); border:1px solid var(--fl-line); border-radius:14px; padding:21px 18px; text-align:left; }
    #foodlink-target-ui .fl-entry-title { font-size:16px; font-weight:600; }
    #foodlink-target-ui .fl-entry .fl-sub { display:block; margin-top:7px; font-size:12px; }
    #foodlink-target-ui .fl-profile-body { min-height:490px; }
    #foodlink-target-ui .fl-stat-plan { margin:5px 0 18px; }
    #foodlink-target-ui .fl-micro-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    #foodlink-target-ui .fl-micro-tile { padding:13px 14px; background:var(--fl-surface); border:1px solid var(--fl-line); border-radius:11px; min-width:0; }
    #foodlink-target-ui .fl-micro-tile strong { display:block; margin:5px 0; font-weight:500; font-size:15px; }
    #foodlink-target-ui .fl-micro-tile small { font-size:11px; color:var(--fl-sub); display:block; }
    #foodlink-target-ui .fl-micro-tile .fl-track { margin-top:8px; height:4px; }
    #foodlink-target-ui .fl-micro-list { background:var(--fl-surface); border:1px solid var(--fl-line); border-radius:13px; padding:2px 14px; }
    #foodlink-target-ui .fl-micro-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:3px 12px; padding:13px 0; border-bottom:1px solid var(--fl-line); font-size:13px; }
    #foodlink-target-ui .fl-micro-row:last-child { border:0; }
    #foodlink-target-ui .fl-micro-row small { font-size:11px; color:var(--fl-sub); }
    #foodlink-target-ui .fl-micro-row .fl-micro-value { text-align:right; font-variant-numeric:tabular-nums; }
    #foodlink-target-ui .fl-micro-status { font-size:11px; color:var(--fl-sub); }
    #foodlink-target-ui .fl-micro-custom { margin:10px 0 20px; }
    #foodlink-target-ui .fl-micro-custom summary { font-size:13px; }
    #foodlink-target-ui .fl-micro-caption { margin:10px 2px 0; color:var(--fl-sub); font-size:11px; line-height:1.6; }
    #foodlink-target-ui .fl-library-create { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:19px; }
    #foodlink-target-ui .fl-preset-card { display:block; width:100%; text-align:left; background:var(--fl-surface); border:1px solid var(--fl-line); border-radius:14px; padding:18px; margin:12px 0; }
    #foodlink-target-ui .fl-preset-kind { color:var(--fl-green); font-size:11px; margin-bottom:5px; display:block; }
    #foodlink-target-ui .fl-preset-card p { color:var(--fl-sub); font-size:12px; margin:8px 0; line-height:1.65; }
    #foodlink-target-ui .fl-preset-preview { color:var(--fl-green); font-size:12px; margin-top:12px; display:block; }
    #foodlink-target-ui .fl-guide-list { color:var(--fl-text); font-size:13px; padding-left:20px; line-height:1.8; }
    #foodlink-target-ui .fl-guide-list li { margin:5px 0; }
    #foodlink-target-ui .fl-cycle-inputs { margin:15px 0; }
    #foodlink-target-ui .fl-cycle-result { background:var(--fl-green-soft); color:var(--fl-green); border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.8; }
    @media (max-width:880px) {
      #foodlink-target-ui { display:flex; flex-direction:column; align-items:center; padding:22px 16px; gap:22px; }
      #foodlink-target-ui .fl-preview-guide { max-width:420px; width:100%; padding-top:0; }
      #foodlink-target-ui .fl-preview-guide h1 { font-size:22px; line-height:1.45; margin:10px 0; }
      #foodlink-target-ui .fl-preview-guide h1 br { display:none; }
      #foodlink-target-ui .fl-preview-lead { margin:8px 0 15px; font-size:13px; }
      #foodlink-target-ui .fl-preview-path { padding-bottom:13px; font-size:12px; }
      #foodlink-target-ui .fl-preview-location { padding:13px 0; }
      #foodlink-target-ui .fl-preview-details, #foodlink-target-ui .fl-preview-foot, #foodlink-target-ui .fl-preview-reset { display:none; }
    }
    @media (max-width:360px) {
      #foodlink-target-ui { padding:16px 6px; }
      #foodlink-target-ui .fl-main { padding-left:12px; padding-right:12px; }
      #foodlink-target-ui .fl-card { padding-left:15px; padding-right:15px; }
      #foodlink-target-ui .fl-choice { padding-left:11px; padding-right:11px; }
      #foodlink-target-ui .fl-choice-energy { font-size:16px; }
      #foodlink-target-ui .fl-home-macro-detail { font-size:11px; }
      #foodlink-target-ui .fl-number { font-size:38px; }
    }

    #foodlink-target-ui { display:grid; grid-template-columns:240px minmax(0,420px); justify-content:center; align-items:start; gap:36px; padding:26px 16px; color-scheme:light; }
    #foodlink-target-ui .fl-preview-guide { padding-top:20px; }
    #foodlink-target-ui .fl-preview-guide h1 { font-size:26px; line-height:1.35; letter-spacing:-.7px; margin:14px 0; }
    #foodlink-target-ui .fl-preview-lead { font-size:13px; margin:0 0 22px; }
    #foodlink-target-ui .fl-preview-buttons { gap:8px; }
    #foodlink-target-ui .fl-preview-details { font-size:12px; line-height:1.9; }
    #foodlink-target-ui .fl-preview-foot { font-size:12px; }
    #foodlink-target-ui .fl-app { --fl-bg:#f8f6e9; --fl-surface:#fffef8; --fl-text:#173f34; --fl-sub:#77877f; --fl-line:#e1e8dc; --fl-green:#216f50; --fl-green-soft:#eaf2e4; --fl-green-on:#fffef3; --fl-track:#dce5d9; background:var(--fl-bg); border:1px solid #dfe5d8; border-radius:26px; overflow:hidden; box-shadow:0 16px 50px #234d3212; max-width:420px; min-height:650px; container-type:inline-size; }
    #foodlink-target-ui .fl-icon { font-family:FoodlinkIcons; font-style:normal; font-weight:400; line-height:1; flex-shrink:0; }
    #foodlink-target-ui .fl-home-page { position:relative; isolation:isolate; padding-top:24px; }
    #foodlink-target-ui .fl-botanical { position:absolute; z-index:-1; inset:0; width:100%; height:100%; object-fit:cover; opacity:.34; pointer-events:none; }
    #foodlink-target-ui .fl-home-head { padding:0 4cqw; display:flex; align-items:center; gap:8px; min-height:64px; }
    #foodlink-target-ui .fl-pet { width:16.3cqw; height:16.5cqw; object-fit:contain; flex-shrink:0; }
    #foodlink-target-ui .fl-pet-bubble { position:relative; background:#fffdf6e0; border:1px solid #e7bd7085; border-radius:15px; padding:9px 13px; box-shadow:0 6px 18px #35584412; font-size:12px; line-height:1.65; font-weight:750; }
    #foodlink-target-ui .fl-pet-bubble::before { content:&#x27;&#x27;; position:absolute; left:-5px; top:15px; width:8px; height:8px; background:#fffdf6; border-left:1px solid #e7bd7085; border-bottom:1px solid #e7bd7085; transform:rotate(45deg); }
    #foodlink-target-ui .fl-layout-tools { display:flex; justify-content:flex-end; padding:0 4.2cqw; min-height:24px; color:#526c60; font-size:11px; font-weight:650; }
    #foodlink-target-ui .fl-layout-tools span { display:flex; align-items:center; gap:4px; }
    #foodlink-target-ui .fl-calendar { padding:0 4cqw 12px; }
    #foodlink-target-ui .fl-calendar-title { display:flex; align-items:baseline; gap:9px; margin:1px 2px 6px; }
    #foodlink-target-ui .fl-calendar-title strong { font-size:23px; font-weight:900; letter-spacing:-1px; }
    #foodlink-target-ui .fl-calendar-title span { font-size:13px; font-weight:700; color:#64746d; }
    #foodlink-target-ui .fl-date-row { padding:0; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }
    #foodlink-target-ui .fl-date { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; min-width:0; padding:6px 0 11px; min-height:57px; border-radius:24px; position:relative; font-size:12px; color:#64756c; }
    #foodlink-target-ui .fl-date small { font-size:11px; font-weight:500; }
    #foodlink-target-ui .fl-date b { font-size:13px; font-weight:750; }
    #foodlink-target-ui .fl-date:disabled { opacity:.58; }
    #foodlink-target-ui .fl-date[aria-pressed=&quot;true&quot;] { color:#fffdf1; background:linear-gradient(180deg,#2f865f,#12563f); box-shadow:0 6px 13px #105b3f30; }
    #foodlink-target-ui .fl-date[aria-pressed=&quot;true&quot;]::after { content:&#x27;&#x27;; position:absolute; bottom:4px; width:4px; height:4px; border-radius:50%; background:#fff9d7; }
    #foodlink-target-ui .fl-home-main { padding:0 4cqw 20px; }
    #foodlink-target-ui .fl-nutrition-panel { position:relative; padding:3.47cqw 3.2cqw 2.67cqw; margin:8px 0 13px; min-height:46.67cqw; }
    #foodlink-target-ui .fl-orbit { position:absolute; top:-4.8cqw; left:-4.27cqw; width:calc(100% + 8.54cqw); height:53.87cqw; object-fit:contain; z-index:0; pointer-events:none; }
    #foodlink-target-ui .fl-nutrition-top { position:relative; z-index:1; display:flex; align-items:center; gap:3.73cqw; min-height:37.33cqw; }
    #foodlink-target-ui .fl-gauge { position:relative; width:38.67cqw; height:38.67cqw; flex:0 0 38.67cqw; border-radius:50%; background:conic-gradient(from 225deg,#18875d 0 var(--fl-progress),#c9dcccbd var(--fl-progress) 75%,transparent 75% 100%); filter:drop-shadow(0 7px 11px #1f714d19); }
    #foodlink-target-ui .fl-gauge::after { content:&#x27;&#x27;; position:absolute; inset:2.67cqw; border-radius:50%; background:#fffef7e0; box-shadow:inset 0 0 14px #ffffffa3; }
    #foodlink-target-ui .fl-gauge.is-over { background:conic-gradient(from 225deg,#c16c55 0 75%,transparent 75%); }
    #foodlink-target-ui .fl-gauge-center { position:absolute; z-index:1; inset:4.53cqw 2.4cqw 1.87cqw; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    #foodlink-target-ui .fl-gauge-label { color:#758078; font-size:3.33cqw; font-weight:650; white-space:nowrap; }
    #foodlink-target-ui .fl-gauge-value { color:#073d2f; font-size:9.87cqw; font-weight:900; letter-spacing:-.4cqw; line-height:10.93cqw; font-variant-numeric:tabular-nums; }
    #foodlink-target-ui .fl-gauge-unit { font-size:3.33cqw; font-weight:700; line-height:1.4; }
    #foodlink-target-ui .fl-gauge-center .fl-icon { margin-top:3px; color:#70a653; font-size:4.13cqw; }
    #foodlink-target-ui .fl-nutrition-detail { flex:1; min-width:0; align-self:center; position:relative; padding-top:4px; }
    #foodlink-target-ui .fl-target-top { position:absolute; right:0; top:-18px; display:flex; justify-content:flex-end; gap:5px; }
    #foodlink-target-ui .fl-target-button { display:flex; align-items:center; gap:4px; white-space:nowrap; background:#f9fbeec2; color:#34664f; border:1px solid #28684c24; border-radius:99px; padding:5px 8px; font-size:11px; min-height:30px; }
    #foodlink-target-ui .fl-target-button .fl-icon { font-size:13px; }
    #foodlink-target-ui .fl-home-macros { display:flex; flex-direction:column; gap:11px; margin:14px 0 0; }
    #foodlink-target-ui .fl-home-macro { display:grid; grid-template-columns:54px minmax(0,1fr); gap:0 4px; align-items:center; }
    #foodlink-target-ui .fl-home-macro-name { display:flex; align-items:center; gap:3px; font-size:12px; color:#173f34; font-weight:800; margin:0; white-space:nowrap; }
    #foodlink-target-ui .fl-home-macro-name .fl-icon { font-size:13px; color:#0e5b42; }
    #foodlink-target-ui .fl-home-macro-number { grid-column:2; text-align:right; color:#33765a; font-size:12px; font-weight:850; white-space:nowrap; }
    #foodlink-target-ui .fl-home-macro-number small { font-size:10px; color:#7a8780; margin-left:1px; font-weight:500; }
    #foodlink-target-ui .fl-home-macro .fl-track { grid-column:2; height:5.5px; margin-top:4px; background:#aab6ad61; overflow:hidden; }
    #foodlink-target-ui .fl-home-macro .fl-fill { background:linear-gradient(90deg,#6bbb93,#99d29a); }
    #foodlink-target-ui .fl-home-macro:nth-child(2) .fl-fill { background:linear-gradient(90deg,#efb833,#ffd765); }
    #foodlink-target-ui .fl-home-macro:nth-child(3) .fl-fill { background:linear-gradient(90deg,#337f5c,#85b56f); }
    #foodlink-target-ui .fl-panel-plan { font-size:11px; color:#5d7869; margin:5px 0 0 2px; }
    #foodlink-target-ui .fl-panel-plan strong { font-weight:750; color:#2b664d; }
    #foodlink-target-ui .fl-nutrition-shell { position:relative; z-index:2; margin-top:-3px; }
    #foodlink-target-ui .fl-expand-button { border:0; background:transparent; width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 3px; min-height:40px; color:#4f7563; font-size:11px; }
    #foodlink-target-ui .fl-expand-button &gt; span:last-child { display:flex; align-items:center; gap:5px; border-radius:99px; padding:4px 9px; background:#e4eddfa8; color:#55806c; }
    #foodlink-target-ui .fl-expand-chevron { display:block; width:6px; height:6px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(45deg); margin-top:-3px; }
    #foodlink-target-ui .fl-expand-button[aria-expanded=&quot;true&quot;] .fl-expand-chevron { transform:rotate(225deg); margin-top:3px; }
    #foodlink-target-ui .fl-nutrition-expanded { padding:12px 11px; border:1px solid #ffffffcc; border-radius:15px; background:#fffef7f2; }
    #foodlink-target-ui [hidden] { display:none !important; }
    #foodlink-target-ui .fl-micro-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12px; }
    #foodlink-target-ui .fl-micro-heading strong { font-weight:750; }
    #foodlink-target-ui .fl-micro-heading &gt; span { display:flex; align-items:center; gap:7px; color:#849286; font-size:11px; }
    #foodlink-target-ui .fl-micro-manage { padding:5px 10px; min-height:30px; border:1px solid #dce8d8; border-radius:99px; background:#eef5e7; color:#47735a; font-size:11px; }
    #foodlink-target-ui .fl-micro-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; }
    #foodlink-target-ui .fl-micro-tile { background:var(--fl-micro-bg); border:1px solid var(--fl-micro-border); border-radius:8px; padding:7px 5px; min-width:0; text-align:left; }
    #foodlink-target-ui .fl-micro-tile &gt; span { display:block; font-size:11px; line-height:1.4; color:#617268; white-space:nowrap; }

    #foodlink-target-ui .fl-meal-row { gap:9px; padding:13px 0; }
    #foodlink-target-ui .fl-meal-icon { display:flex; align-items:center; justify-content:center; border-radius:50%; width:34px; height:34px; flex-shrink:0; background:#f3edd9; color:#49745b; font-size:18px; border:2px solid #fff; }
    #foodlink-target-ui .fl-meal-row &gt; div:nth-child(2) { flex:1; min-width:0; }
