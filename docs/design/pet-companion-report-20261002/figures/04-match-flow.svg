<text x="70" y="45" fill="#376F59" font-size="16" font-weight="600" text-anchor="start">FOOD LINK  /  COMPANION EXPERIENCE</text>
<text x="70" y="104" fill="#243F38" font-size="44" font-weight="600" text-anchor="start">一次真人比赛，如何公平地完成</text>
<text x="70" y="143" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">四款游戏各自按基础分竞赛；衣服、体型、等级与真实生活记录不增加竞技能力。</text>
<path d="M70,167 H1330" stroke="#D5DED3" stroke-width="1.5"/>
<rect x="70" y="232" width="270" height="175" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="105" cy="268" r="17" fill="#397B8C"/><text x="105" y="274" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">01</text><text x="133" y="276" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">自愿排队</text><text x="95" y="317" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">单人始终可玩</text><text x="95" y="347" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">取消无资源处罚</text><rect x="390" y="232" width="270" height="175" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="425" cy="268" r="17" fill="#376F59"/><text x="425" y="274" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">02</text><text x="453" y="276" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">双方确认</text><text x="415" y="317" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">同游戏 · 同规则</text><text x="415" y="347" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">准备时间统一</text><rect x="710" y="232" width="270" height="175" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="745" cy="268" r="17" fill="#397B8C"/><text x="745" y="274" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">03</text><text x="773" y="276" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">同种子开局</text><text x="735" y="317" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">同地图、订单、生成序列</text><text x="735" y="347" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">同操作与计分参数</text><rect x="1030" y="232" width="300" height="175" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="1065" cy="268" r="17" fill="#376F59"/><text x="1065" y="274" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">04</text><text x="1093" y="276" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">输入与快照</text><text x="1055" y="317" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">记录操作序列</text><text x="1055" y="347" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">客户端及时反馈</text><path d="M 351,320 L 378,320" fill="none" stroke="#397B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-397B8C)"/><path d="M 671,320 L 698,320" fill="none" stroke="#376F59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-376F59)"/><path d="M 991,320 L 1018,320" fill="none" stroke="#397B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-397B8C)"/><rect x="960" y="526" width="370" height="178" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="995" cy="562" r="17" fill="#397B8C"/><text x="995" y="568" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">05</text><text x="1023" y="570" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">断线恢复</text><text x="985" y="611" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">快照 + 剩余时间</text><text x="985" y="641" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">异常无法恢复则作废</text><rect x="515" y="526" width="370" height="178" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="550" cy="562" r="17" fill="#376F59"/><text x="550" y="568" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">06</text><text x="578" y="570" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">服务端核验</text><text x="540" y="611" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">确定性重放与得分复算</text><text x="540" y="641" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">不接受自报高分</text><rect x="70" y="526" width="370" height="178" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="105" cy="562" r="17" fill="#B98338"/><text x="105" y="568" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">07</text><text x="133" y="570" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">事务奖励</text><text x="95" y="611" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">结算、星光与背包原子提交</text><text x="95" y="641" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">唯一局号防重复发放</text><path d="M 1180,419 L 1180,514" fill="none" stroke="#397B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-397B8C)"/><path d="M 948,615 L 897,615" fill="none" stroke="#376F59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-376F59)"/><path d="M 503,615 L 452,615" fill="none" stroke="#B98338" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-B98338)"/><text x="700" y="476" fill="#376F59" font-size="21" font-weight="600" text-anchor="middle">公平来源：相同规则与可复算输入，外观和健康数据不加分。</text><rect x="70" y="728" width="190" height="33" rx="16" fill="#FBF0DF" stroke="none" stroke-width="1.5"/><text x="165.0" y="751" fill="#B98338" font-size="16" font-weight="600" text-anchor="middle">当前尚无真人 PK</text><text x="282" y="752" fill="#667B72" font-size="19" font-weight="400" text-anchor="start">房间服务、核验、恢复与云奖励须完成后，才开放真人匹配。</text>
