nt-weight="400" text-anchor="start">验证主动复玩与温馨感</text><rect x="965" y="521" width="360" height="182" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="1000" cy="557" r="17" fill="#B98338"/><text x="1000" y="563" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">04</text><text x="1028" y="565" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">云档案与星光账本</text><text x="990" y="606" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">跨设备恢复 · 幂等结算</text><text x="990" y="636" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">固定购买与兼容校验</text><text x="990" y="666" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">生活任务按真实事件关联</text><rect x="520" y="521" width="360" height="182" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="555" cy="557" r="17" fill="#397B8C"/><text x="555" y="563" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">05</text><text x="583" y="565" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">可选真人 PK</text><text x="545" y="606" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">同种子输入重放</text><text x="545" y="636" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">断线恢复、核验与事务发奖</text><text x="545" y="666" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">两个真实账号完整验收</text><rect x="75" y="521" width="360" height="182" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="110" cy="557" r="17" fill="#376F59"/><text x="110" y="563" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">06</text><text x="138" y="565" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">四款完整游戏</text><text x="100" y="606" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">餐车 · 合成 · 冒险 · 寻宝</text><text x="100" y="636" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">关卡、收藏与故事各有差异</text><text x="100" y="666" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">每款完成单人及匹配验收</text><path d="M 447,320 L 508,320" fill="none" stroke="#376F59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-376F59)"/><path d="M 892,320 L 953,320" fill="none" stroke="#397B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-397B8C)"/><path d="M 1145,423 L 1145,509" fill="none" stroke="#397B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-397B8C)"/><path d="M 953,612 L 892,612" fill="none" stroke="#B98338" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-B98338)"/><path d="M 508,612 L 447,612" fill="none" stroke="#397B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-397B8C)"/><text x="700" y="474" fill="#376F59" font-size="26" font-weight="600" text-anchor="middle">每阶段独立验收，再进入下一阶段。</text><text x="75" y="747" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">顺序为候选；不以本机成绩、静态封面或文档完成代替功能交付。</text>
