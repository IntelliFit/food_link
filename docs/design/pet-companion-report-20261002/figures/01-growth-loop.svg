<text x="70" y="45" fill="#376F59" font-size="16" font-weight="600" text-anchor="start">FOOD LINK  /  COMPANION EXPERIENCE</text>
<text x="70" y="104" fill="#243F38" font-size="44" font-weight="600" text-anchor="start">让每次回来，都看见一点变化</text>
<text x="70" y="143" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">生活、游戏与收藏汇入同一段陪伴关系；日常记录不提高游戏竞技分。</text>
<path d="M70,167 H1330" stroke="#D5DED3" stroke-width="1.5"/>
<rect x="75" y="230" width="360" height="170" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="110" cy="266" r="17" fill="#397B8C"/><text x="110" y="272" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">01</text><text x="138" y="274" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">生活事件</text><text x="100" y="315" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">可选的餐食、饮水、运动记录</text><text x="100" y="345" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">表达习惯，不评判身体</text><rect x="520" y="230" width="360" height="170" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="555" cy="266" r="17" fill="#376F59"/><text x="555" y="272" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">02</text><text x="583" y="274" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">伙伴成长</text><text x="545" y="315" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">经验、关系与章节进度</text><text x="545" y="345" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">不因漏玩衰退或受伤</text><rect x="965" y="230" width="360" height="170" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="1000" cy="266" r="17" fill="#397B8C"/><text x="1000" y="272" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">03</text><text x="1028" y="274" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">四款游戏</text><text x="990" y="315" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">餐车 · 合成 · 冒险 · 寻宝</text><text x="990" y="345" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">单人随时开始</text><rect x="965" y="500" width="360" height="170" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="1000" cy="536" r="17" fill="#B98338"/><text x="1000" y="542" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">04</text><text x="1028" y="544" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">星光与收藏</text><text x="990" y="585" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">固定奖品、可追溯结算</text><text x="990" y="615" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">奖励服务装扮与内容</text><rect x="520" y="500" width="360" height="170" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="555" cy="536" r="17" fill="#376F59"/><text x="555" y="542" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">05</text><text x="583" y="544" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">衣橱 · 小屋 · 剧情</text><text x="545" y="585" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">把获得的物件穿上、放好</text><text x="545" y="615" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">看见自己的长期变化</text><rect x="75" y="500" width="360" height="170" rx="24" fill="#FFFEFA" stroke="#D9E2D9" stroke-width="1.5"/><circle cx="110" cy="536" r="17" fill="#397B8C"/><text x="110" y="542" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">06</text><text x="138" y="544" fill="#243F38" font-size="26" font-weight="600" text-anchor="start">新的相遇</text><text x="100" y="585" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">新动作、来信与地图事件</text><text x="100" y="615" fill="#667B72" font-size="20" font-weight="400" text-anchor="start">带着喜欢的伙伴再出发</text><path d="M 444,315 L 508,315" fill="none" stroke="#376F59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-376F59)"/><path d="M 889,315 L 953,315" fill="none" stroke="#376F59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-376F59)"/><path d="M 1145,409 L 1145,488" fill="none" stroke="#397B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-397B8C)"/><path d="M 954,585 L 892,585" fill="none" stroke="#B98338" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-B98338)"/><path d="M 509,585 L 447,585" fill="none" stroke="#376F59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-376F59)"/><path d="M 255,489 L 255,412" fill="none" stroke="#397B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-397B8C)"/><text x="700" y="455" fill="#376F59" font-size="25" font-weight="600" text-anchor="middle">陪伴循环：获得 → 使用 → 留下记忆</text><rect x="75" y="715" width="200" height="33" rx="16" fill="#E9F0E7" stroke="none" stroke-width="1.5"/><text x="175.0" y="738" fill="#376F59" font-size="16" font-weight="600" text-anchor="middle">已有本机成长基础</text><text x="295" y="739" fill="#667B72" font-size="19" font-weight="400" text-anchor="start">生活联动、统一收藏与云端账本仍属候选建设。</text>
