<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">让每次回来，都看见一点变化</title>
<desc id="chart-desc">生活、游戏与收藏汇入同一段陪伴关系；日常记录不提高游戏竞技分。。图中的新增流程均为候选设计；当前实现范围以报告正文为准。</desc>
<defs><marker id="arrow-376F59" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#376F59"/></marker><marker id="arrow-397B8C" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#397B8C"/></marker><marker id="arrow-B98338" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9 Z" fill="#B98338"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#DFE5DA" opacity="0.45"/></pattern></defs>
<g font-family="Microsoft YaHei, 微软雅黑, Noto Sans CJK SC, sans-serif">
<rect width="1400" height="850" fill="#F6F3EB"/>
