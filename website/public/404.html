<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>页面不存在丨智健食探</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #10233f; background: #f4f8f8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #e4f7f0, #f4f8f8 55%); }
      main { width: min(560px, 100%); border: 1px solid #dbe7e4; border-radius: 28px; background: rgba(255,255,255,.92); padding: 48px; box-shadow: 0 24px 70px rgba(16,35,63,.09); }
      span { display: inline-flex; border-radius: 999px; background: #dff7ee; color: #008c69; padding: 6px 12px; font-size: 14px; font-weight: 700; }
      h1 { margin: 20px 0 12px; font-size: clamp(32px, 7vw, 52px); letter-spacing: -.04em; }
      p { margin: 0; color: #5e6d7f; line-height: 1.8; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      a { border-radius: 12px; padding: 12px 18px; text-decoration: none; font-weight: 700; color: #fff; background: #00b884; }
      a.secondary { color: #10233f; background: #edf3f2; }
    </style>
  </head>
  <body>
    <main>
      <span>404</span>
      <h1>这里没有你要找的内容</h1>
      <p>请检查地址是否正确。下载 MCP、查看开发文档或管理 API Key，请使用下面的正式入口。</p>
      <nav aria-label="可用入口">
        <a href="/developer/docs/">开发文档</a>
        <a class="secondary" href="/developer/">开放平台</a>
        <a class="secondary" href="/">返回首页</a>
      </nav>
    </main>
  </body>
</html>
